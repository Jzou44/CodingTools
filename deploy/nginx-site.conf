limit_req_zone $binary_remote_addr zone=runtime_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=runtime_addr:10m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root __WEB_ROOT__;
    index index.html;
    error_page 404 /404.html;
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /.well-known/agent-card.json {
        expires 5m;
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    # Relative locations keep the public scheme and port when TLS ends at the proxy.
    location ~ ^/(?:(?:cn|tw|jp|kr|fr|de|es|pt)/)?(?:md5|sha1|sha256|sha384|sha512)$ {
        absolute_redirect off;
        return 301 ${uri}-generator.html$is_args$args;
    }

    location ~ ^/(cn|tw|jp|kr|fr|de|es|pt)/?$ {
        absolute_redirect off;
        return 301 /$1/index.html$is_args$args;
    }

    location ~ ^/(?:(?:cn|tw|jp|kr|fr|de|es|pt)/)?nslookup$ {
        absolute_redirect off;
        return 301 ${uri}.html$is_args$args;
    }

    location / {
        expires -1;
        try_files $uri $uri/ $uri.html =404;
    }

    location = /a2a {
        limit_req zone=runtime_api burst=30 nodelay;
        limit_conn runtime_addr 20;
        proxy_pass http://127.0.0.1:5510/a2a;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location ^~ /a2a/ {
        limit_req zone=runtime_api burst=30 nodelay;
        limit_conn runtime_addr 20;
        proxy_pass http://127.0.0.1:5510/a2a/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /mcp {
        limit_req zone=runtime_api burst=30 nodelay;
        limit_conn runtime_addr 20;
        proxy_pass http://127.0.0.1:5510/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Content-addressed build assets can be cached for a year.
    location ~ "^/(css|js)/.+\.[a-f0-9]{16}\.(css|js)$" {
        expires 1y;
        try_files $uri =404;
    }

    # Unversioned assets must refresh after deployment.
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|webp|wasm|onnx|woff2?)$ {
        expires 1h;
        try_files $uri =404;
    }

    location ~* \.(json|webmanifest)$ {
        expires -1;
        try_files $uri =404;
    }
}
