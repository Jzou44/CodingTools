interface:
  display_name: "Coding.Tools Binary to Decimal"
  short_description: "Convert binary numbers to decimal format."
  default_prompt: "Use $coding-tools-binary-to-decimal to run Binary to Decimal through Coding.Tools MCP."
dependencies:
  tools:
    - type: "mcp"
      value: "coding-tools"
      description: "Coding.Tools MCP endpoint for Binary to Decimal."
      transport: "streamable_http"
      url: "https://coding.tools/mcp"
policy:
  allow_implicit_invocation: true
