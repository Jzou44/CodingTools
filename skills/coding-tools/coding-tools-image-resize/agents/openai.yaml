interface:
  display_name: "Coding.Tools Image Resize"
  short_description: "Resize PNG, JPEG, and WebP images precisely in your browser."
  default_prompt: "Use $coding-tools-image-resize to run Image Resize through Coding.Tools MCP."
dependencies:
  tools:
    - type: "mcp"
      value: "coding-tools"
      description: "Coding.Tools MCP endpoint for Image Resize."
      transport: "streamable_http"
      url: "https://coding.tools/mcp"
policy:
  allow_implicit_invocation: true
