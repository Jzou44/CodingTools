interface:
  display_name: "Coding.Tools Binary to Text"
  short_description: "Convert binary code to readable ASCII text."
  default_prompt: "Use $coding-tools-binary-to-text to run Binary to Text through Coding.Tools MCP."
dependencies:
  tools:
    - type: "mcp"
      value: "coding-tools"
      description: "Coding.Tools MCP endpoint for Binary to Text."
      transport: "streamable_http"
      url: "https://coding.tools/mcp"
policy:
  allow_implicit_invocation: true
