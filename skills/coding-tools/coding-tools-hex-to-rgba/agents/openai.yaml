interface:
  display_name: "Coding.Tools Hex to RGBA"
  short_description: "Convert hex color codes to RGBA format with opacity control."
  default_prompt: "Use $coding-tools-hex-to-rgba to run Hex to RGBA through Coding.Tools MCP."
dependencies:
  tools:
    - type: "mcp"
      value: "coding-tools"
      description: "Coding.Tools MCP endpoint for Hex to RGBA."
      transport: "streamable_http"
      url: "https://coding.tools/mcp"
policy:
  allow_implicit_invocation: true
