interface:
  display_name: "Coding.Tools Fraction to Percent"
  short_description: "Convert fractions to percentages."
  default_prompt: "Use $coding-tools-fraction-to-percent to run Fraction to Percent through Coding.Tools MCP."
dependencies:
  tools:
    - type: "mcp"
      value: "coding-tools"
      description: "Coding.Tools MCP endpoint for Fraction to Percent."
      transport: "streamable_http"
      url: "https://coding.tools/mcp"
policy:
  allow_implicit_invocation: true
