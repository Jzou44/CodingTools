interface:
  display_name: "Coding.Tools Text Compare"
  short_description: "Compare two blocks of text line by line."
  default_prompt: "Use $coding-tools-text-compare to run Text Compare through Coding.Tools MCP."
dependencies:
  tools:
    - type: "mcp"
      value: "coding-tools"
      description: "Coding.Tools MCP endpoint for Text Compare."
      transport: "streamable_http"
      url: "https://coding.tools/mcp"
policy:
  allow_implicit_invocation: true
