interface:
  display_name: "Coding.Tools MD5 Generator"
  short_description: "Generate MD5 hash from any text input."
  default_prompt: "Use $coding-tools-md5-generator to run MD5 Generator through Coding.Tools MCP."
dependencies:
  tools:
    - type: "mcp"
      value: "coding-tools"
      description: "Coding.Tools MCP endpoint for MD5 Generator."
      transport: "streamable_http"
      url: "https://coding.tools/mcp"
policy:
  allow_implicit_invocation: true
