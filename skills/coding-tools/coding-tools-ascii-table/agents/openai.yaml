interface:
  display_name: "Coding.Tools ASCII Table"
  short_description: "View the complete ASCII character table with codes and symbols."
  default_prompt: "Use $coding-tools-ascii-table to run ASCII Table through Coding.Tools MCP."
dependencies:
  tools:
    - type: "mcp"
      value: "coding-tools"
      description: "Coding.Tools MCP endpoint for ASCII Table."
      transport: "streamable_http"
      url: "https://coding.tools/mcp"
policy:
  allow_implicit_invocation: true
