interface:
  display_name: "Coding.Tools Base64 Decode"
  short_description: "Decode Base64 strings back to readable text."
  default_prompt: "Use $coding-tools-base64-decode to run Base64 Decode through Coding.Tools MCP."
dependencies:
  tools:
    - type: "mcp"
      value: "coding-tools"
      description: "Coding.Tools MCP endpoint for Base64 Decode."
      transport: "streamable_http"
      url: "https://coding.tools/mcp"
policy:
  allow_implicit_invocation: true
