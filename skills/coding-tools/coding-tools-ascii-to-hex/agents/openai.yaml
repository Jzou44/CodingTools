interface:
  display_name: "Coding.Tools ASCII to Hex"
  short_description: "Convert ASCII text to hexadecimal values."
  default_prompt: "Use $coding-tools-ascii-to-hex to run ASCII to Hex through Coding.Tools MCP."
dependencies:
  tools:
    - type: "mcp"
      value: "coding-tools"
      description: "Coding.Tools MCP endpoint for ASCII to Hex."
      transport: "streamable_http"
      url: "https://coding.tools/mcp"
policy:
  allow_implicit_invocation: true
