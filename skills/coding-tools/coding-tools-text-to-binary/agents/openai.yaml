interface:
  display_name: "Coding.Tools Text to Binary"
  short_description: "Convert text to binary code representation."
  default_prompt: "Use $coding-tools-text-to-binary to run Text to Binary through Coding.Tools MCP."
dependencies:
  tools:
    - type: "mcp"
      value: "coding-tools"
      description: "Coding.Tools MCP endpoint for Text to Binary."
      transport: "streamable_http"
      url: "https://coding.tools/mcp"
policy:
  allow_implicit_invocation: true
