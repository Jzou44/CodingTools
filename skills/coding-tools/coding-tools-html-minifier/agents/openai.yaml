interface:
  display_name: "Coding.Tools HTML Minifier"
  short_description: "Minify HTML by removing whitespace, comments, and unnecessary..."
  default_prompt: "Use $coding-tools-html-minifier to run HTML Minifier through Coding.Tools MCP."
dependencies:
  tools:
    - type: "mcp"
      value: "coding-tools"
      description: "Coding.Tools MCP endpoint for HTML Minifier."
      transport: "streamable_http"
      url: "https://coding.tools/mcp"
policy:
  allow_implicit_invocation: true
