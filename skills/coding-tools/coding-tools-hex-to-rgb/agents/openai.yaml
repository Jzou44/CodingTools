interface:
  display_name: "Coding.Tools Hex to RGB"
  short_description: "Convert hex color codes to RGB format with live preview."
  default_prompt: "Use $coding-tools-hex-to-rgb to run Hex to RGB through Coding.Tools MCP."
dependencies:
  tools:
    - type: "mcp"
      value: "coding-tools"
      description: "Coding.Tools MCP endpoint for Hex to RGB."
      transport: "streamable_http"
      url: "https://coding.tools/mcp"
policy:
  allow_implicit_invocation: true
