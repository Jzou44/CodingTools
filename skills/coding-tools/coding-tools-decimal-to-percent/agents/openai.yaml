interface:
  display_name: "Coding.Tools Decimal to Percent"
  short_description: "Convert decimal numbers to percentages."
  default_prompt: "Use $coding-tools-decimal-to-percent to run Decimal to Percent through Coding.Tools MCP."
dependencies:
  tools:
    - type: "mcp"
      value: "coding-tools"
      description: "Coding.Tools MCP endpoint for Decimal to Percent."
      transport: "streamable_http"
      url: "https://coding.tools/mcp"
policy:
  allow_implicit_invocation: true
