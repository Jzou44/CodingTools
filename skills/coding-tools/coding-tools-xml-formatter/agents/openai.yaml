interface:
  display_name: "Coding.Tools XML Formatter"
  short_description: "Format and beautify XML code with proper indentation."
  default_prompt: "Use $coding-tools-xml-formatter to run XML Formatter through Coding.Tools MCP."
dependencies:
  tools:
    - type: "mcp"
      value: "coding-tools"
      description: "Coding.Tools MCP endpoint for XML Formatter."
      transport: "streamable_http"
      url: "https://coding.tools/mcp"
policy:
  allow_implicit_invocation: true
