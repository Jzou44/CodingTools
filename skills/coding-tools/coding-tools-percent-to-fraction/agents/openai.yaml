interface:
  display_name: "Coding.Tools Percent to Fraction"
  short_description: "Convert percentages to fractions."
  default_prompt: "Use $coding-tools-percent-to-fraction to run Percent to Fraction through Coding.Tools MCP."
dependencies:
  tools:
    - type: "mcp"
      value: "coding-tools"
      description: "Coding.Tools MCP endpoint for Percent to Fraction."
      transport: "streamable_http"
      url: "https://coding.tools/mcp"
policy:
  allow_implicit_invocation: true
