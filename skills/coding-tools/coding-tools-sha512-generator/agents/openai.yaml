interface:
  display_name: "Coding.Tools SHA512 Generator"
  short_description: "Generate SHA-512 hash from any text input."
  default_prompt: "Use $coding-tools-sha512-generator to run SHA512 Generator through Coding.Tools MCP."
dependencies:
  tools:
    - type: "mcp"
      value: "coding-tools"
      description: "Coding.Tools MCP endpoint for SHA512 Generator."
      transport: "streamable_http"
      url: "https://coding.tools/mcp"
policy:
  allow_implicit_invocation: true
