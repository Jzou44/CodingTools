interface:
  display_name: "Coding.Tools JSON Diff"
  short_description: "Compare two JSON documents and highlight structural differences."
  default_prompt: "Use $coding-tools-json-diff to run JSON Diff through Coding.Tools MCP."
dependencies:
  tools:
    - type: "mcp"
      value: "coding-tools"
      description: "Coding.Tools MCP endpoint for JSON Diff."
      transport: "streamable_http"
      url: "https://coding.tools/mcp"
policy:
  allow_implicit_invocation: true
