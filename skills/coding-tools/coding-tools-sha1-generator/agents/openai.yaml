interface:
  display_name: "Coding.Tools SHA1 Generator"
  short_description: "Generate SHA-1 hash from any text input."
  default_prompt: "Use $coding-tools-sha1-generator to run SHA1 Generator through Coding.Tools MCP."
dependencies:
  tools:
    - type: "mcp"
      value: "coding-tools"
      description: "Coding.Tools MCP endpoint for SHA1 Generator."
      transport: "streamable_http"
      url: "https://coding.tools/mcp"
policy:
  allow_implicit_invocation: true
