interface:
  display_name: "Coding.Tools Octal to Decimal"
  short_description: "Convert octal numbers to decimal format."
  default_prompt: "Use $coding-tools-octal-to-decimal to run Octal to Decimal through Coding.Tools MCP."
dependencies:
  tools:
    - type: "mcp"
      value: "coding-tools"
      description: "Coding.Tools MCP endpoint for Octal to Decimal."
      transport: "streamable_http"
      url: "https://coding.tools/mcp"
policy:
  allow_implicit_invocation: true
