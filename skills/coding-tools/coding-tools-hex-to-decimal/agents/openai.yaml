interface:
  display_name: "Coding.Tools Hex to Decimal"
  short_description: "Convert hexadecimal numbers to decimal format."
  default_prompt: "Use $coding-tools-hex-to-decimal to run Hex to Decimal through Coding.Tools MCP."
dependencies:
  tools:
    - type: "mcp"
      value: "coding-tools"
      description: "Coding.Tools MCP endpoint for Hex to Decimal."
      transport: "streamable_http"
      url: "https://coding.tools/mcp"
policy:
  allow_implicit_invocation: true
