interface:
  display_name: "Coding.Tools Compress PNG"
  short_description: "Reduce PNG file size by converting to palette mode with optim..."
  default_prompt: "Use $coding-tools-compress-png to run Compress PNG through Coding.Tools MCP."
dependencies:
  tools:
    - type: "mcp"
      value: "coding-tools"
      description: "Coding.Tools MCP endpoint for Compress PNG."
      transport: "streamable_http"
      url: "https://coding.tools/mcp"
policy:
  allow_implicit_invocation: true
