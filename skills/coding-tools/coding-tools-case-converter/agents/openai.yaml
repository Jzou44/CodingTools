interface:
  display_name: "Coding.Tools Case Converter"
  short_description: "Convert text to uppercase, lowercase, sentence case, title ca..."
  default_prompt: "Use $coding-tools-case-converter to run Case Converter through Coding.Tools MCP."
dependencies:
