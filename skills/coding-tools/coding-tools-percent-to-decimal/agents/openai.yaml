interface:
  display_name: "Coding.Tools Percent to Decimal"
  short_description: "Convert percentages to decimal numbers."
  default_prompt: "Use $coding-tools-percent-to-decimal to run Percent to Decimal through Coding.Tools MCP."
dependencies:
  tools:
    - type: "mcp"
      value: "coding-tools"
      description: "Coding.Tools MCP endpoint for Percent to Decimal."
      transport: "streamable_http"
      url: "https://coding.tools/mcp"
policy:
  allow_implicit_invocation: true
