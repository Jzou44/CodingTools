interface:
  display_name: "Coding.Tools SHA256 Generator"
  short_description: "Generate SHA-256 hash from any text input."
  default_prompt: "Use $coding-tools-sha256-generator to run SHA256 Generator through Coding.Tools MCP."
dependencies:
  tools:
    - type: "mcp"
      value: "coding-tools"
      description: "Coding.Tools MCP endpoint for SHA256 Generator."
      transport: "streamable_http"
      url: "https://coding.tools/mcp"
policy:
  allow_implicit_invocation: true
