interface:
  display_name: "Coding.Tools JSON Minifier"
  short_description: "Minify JSON by removing whitespace and formatting."
  default_prompt: "Use $coding-tools-json-minifier to run JSON Minifier through Coding.Tools MCP."
dependencies:
  tools:
    - type: "mcp"
      value: "coding-tools"
      description: "Coding.Tools MCP endpoint for JSON Minifier."
      transport: "streamable_http"
      url: "https://coding.tools/mcp"
policy:
  allow_implicit_invocation: true
