interface:
  display_name: "Coding.Tools Decimal to Binary"
  short_description: "Convert decimal numbers to binary format."
  default_prompt: "Use $coding-tools-decimal-to-binary to run Decimal to Binary through Coding.Tools MCP."
dependencies:
  tools:
    - type: "mcp"
      value: "coding-tools"
      description: "Coding.Tools MCP endpoint for Decimal to Binary."
      transport: "streamable_http"
      url: "https://coding.tools/mcp"
policy:
  allow_implicit_invocation: true
