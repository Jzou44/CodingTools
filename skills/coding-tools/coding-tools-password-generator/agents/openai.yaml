interface:
  display_name: "Coding.Tools Password Generator"
  short_description: "Generate strong random passwords with customizable options."
  default_prompt: "Use $coding-tools-password-generator to run Password Generator through Coding.Tools MCP."
dependencies:
  tools:
    - type: "mcp"
      value: "coding-tools"
      description: "Coding.Tools MCP endpoint for Password Generator."
      transport: "streamable_http"
      url: "https://coding.tools/mcp"
policy:
  allow_implicit_invocation: true
