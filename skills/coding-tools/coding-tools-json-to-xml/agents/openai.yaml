interface:
  display_name: "Coding.Tools JSON to XML"
  short_description: "Convert JSON data to XML format."
  default_prompt: "Use $coding-tools-json-to-xml to run JSON to XML through Coding.Tools MCP."
dependencies:
  tools:
    - type: "mcp"
      value: "coding-tools"
      description: "Coding.Tools MCP endpoint for JSON to XML."
      transport: "streamable_http"
      url: "https://coding.tools/mcp"
policy:
  allow_implicit_invocation: true
